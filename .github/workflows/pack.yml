name: NodeJS with Webpack

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # electron-builder 26 依赖的 @electron/rebuild 4.x 要求 Node >= 22.12
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        version: 9
    - name: Build
      run: |
        pnpm install
        # 显式调用，避免 pnpm run 把分隔符 -- 一起传给 electron-builder
        pnpm exec webpack --mode production
        # 只构建产物，不向 GitHub Release 发布，避免缺少 GH_TOKEN 时失败
        pnpm exec electron-builder --publish never

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nb-rename-node${{ matrix.node-version }}
        path: |
          dist/*.AppImage
          dist/*.deb
          dist/*.exe
        if-no-files-found: ignore
        retention-days: 14
    
